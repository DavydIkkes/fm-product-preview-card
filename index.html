<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="css/index.css" />

        <title>Frontend Mentor | Product preview card component</title>

        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution {
                font-size: 0.6875rem;
                text-align: center;
            }
            .attribution a {
                color: hsl(228, 45%, 44%);
            }
        </style>
    </head>
    <body>
        <main role="main" class="card">
            <picture>
                <source
                    srcset="images/image-product-desktop.jpg"
                    media="(width >= 768px)"
                />
                <img
                    class="card__image"
                    src="images/image-product-mobile.jpg"
                    alt="Bottle of parfum layin on the table with leafs"
                />
            </picture>
            <section class="card__content">
                <div class="content container">
                    <p class="content__type">Perfume</p>
                    <h1 class="content__title">
                        Gabrielle Essence Eau De Parfum
                    </h1>
                    <p class="content__body">
                        A floral, solar and voluptuous interpretation composed
                        by Olivier Polge, Perfumer-Creator for the House of
                        CHANEL.
                    </p>
                    <div class="content__price">
                        <p class="content__price-current">$149.99</p>
                        <p class="content__price-old">$169.99</p>
                    </div>
                    <button class="content__button">
                      <img src="images/icon-cart.svg" alt="">
                      Add to Cart</button>
                </div>
            </section>
        </main>
        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
